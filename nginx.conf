server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  include /etc/nginx/snippets/security-headers.conf;

  # Vite deja los assets con hash en /assets/: caché larga e inmutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # index.html nunca en caché, para recoger nuevos despliegues.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Fallback SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
