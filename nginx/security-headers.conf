# Cabeceras equivalentes a las de vercel.json. Mantener ambos sincronizados.
# style-src con 'unsafe-inline': Ionic (web components/Stencil) y React inyectan estilos en línea en tiempo de ejecución.
# script-src 'self': Vite emite <script type="module" src="/assets/..."> externos, sin inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
